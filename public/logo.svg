<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Filter for 3D Drop Shadows -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D Gold Wheel Rim Gradients -->
    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <radialGradient id="goldBevelGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>

    <!-- Center Hub Gradients -->
    <radialGradient id="hubNavyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#1d4ed8"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="hubStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Wind Swoosh Blue Gradient -->
    <linearGradient id="windSwooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="30%" stop-color="#00b4d8"/>
      <stop offset="70%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>

    <!-- Under-Text Blue Swoosh Ribbon Gradient -->
    <linearGradient id="blueRibbonGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Wordmark Gradients -->
    <!-- SPIN Blue Gradient -->
    <linearGradient id="spinFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="35%" stop-color="#1d4ed8"/>
      <stop offset="80%" stop-color="#0a194f"/>
      <stop offset="100%" stop-color="#03082a"/>
    </linearGradient>

    <!-- WHEEL Orange/Gold Gradient -->
    <linearGradient id="wheelFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- GAMES Emerald Gradient -->
    <linearGradient id="gamesFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#044e3b"/>
    </linearGradient>

    <!-- Specular White Top Sheen Gradient -->
    <linearGradient id="topSheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="logo-root">
    <!-- ========================================== -->
    <!-- 1. 3D PRIZE WHEEL ICON (LEFT)             -->
    <!-- ========================================== -->
    <g id="wheel-group" transform="translate(140, 130)">
      <!-- Swirling Blue Speed Trails / Wind Ribbon Behind Wheel -->
      <path d="M -90 -30 C -115 10, -105 75, -60 110 C -30 132, 10 136, 50 126" 
            fill="none" stroke="url(#windSwooshGrad)" stroke-width="8" stroke-linecap="round" opacity="0.9" filter="url(#shadow3d)"/>
      <path d="M -80 -60 C -115 -25, -125 35, -95 85" 
            fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
      <path d="M 50 -95 C 80 -70, 102 -35, 98 20" 
            fill="none" stroke="url(#windSwooshGrad)" stroke-width="7.5" stroke-linecap="round" opacity="0.9" filter="url(#shadow3d)"/>
      <path d="M 20 -105 C 60 -100, 92 -68, 98 -30" 
            fill="none" stroke="#7dd3fc" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>

      <!-- Golden Stars / Sparkles around Wheel -->
      <!-- Top Left Sparkle -->
      <g transform="translate(-95, -70)" filter="url(#sparkleGlow)">
        <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#f59e0b"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      </g>
      <g transform="translate(-115, -35)">
        <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="#fbbf24"/>
      </g>

      <!-- Bottom Right Sparkle -->
      <g transform="translate(80, 85)" filter="url(#sparkleGlow)">
        <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#f59e0b"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      </g>

      <!-- Wheel Drop Shadow -->
      <circle cx="4" cy="8" r="88" fill="#000000" opacity="0.28" filter="url(#shadow3d)"/>

      <!-- Outer 3D Gold Tire Frame -->
      <circle cx="0" cy="0" r="88" fill="url(#goldRimGrad)" stroke="#78350f" stroke-width="4" filter="url(#shadow3d)"/>
      <circle cx="0" cy="0" r="78" fill="none" stroke="#fef08a" stroke-width="2.5"/>

      <!-- 8 Rainbow Sectors (Radius = 76) -->
      <g id="wheel-slices-8">
        <!-- 1. Top Right: Yellow (22.5 to 67.5 deg) -->
        <path d="M 0 0 L 29.08 -70.21 A 76 76 0 0 1 70.21 -29.08 Z" fill="#facc15"/>
        <!-- 2. Mid Right: Vibrant Green (67.5 to 112.5 deg) -->
        <path d="M 0 0 L 70.21 -29.08 A 76 76 0 0 1 70.21 29.08 Z" fill="#22c55e"/>
        <!-- 3. Bottom Right: Electric Cyan (112.5 to 157.5 deg) -->
        <path d="M 0 0 L 70.21 29.08 A 76 76 0 0 1 29.08 70.21 Z" fill="#00d2ff"/>
        <!-- 4. Bottom Mid: Royal Blue (157.5 to 202.5 deg) -->
        <path d="M 0 0 L 29.08 70.21 A 76 76 0 0 1 -29.08 70.21 Z" fill="#2563eb"/>
        <!-- 5. Bottom Left: Vivid Violet (202.5 to 247.5 deg) -->
        <path d="M 0 0 L -29.08 70.21 A 76 76 0 0 1 -70.21 29.08 Z" fill="#7c3aed"/>
        <!-- 6. Mid Left: Hot Magenta (247.5 to 292.5 deg) -->
        <path d="M 0 0 L -70.21 29.08 A 76 76 0 0 1 -70.21 -29.08 Z" fill="#ec4899"/>
        <!-- 7. Top Left: Crimson Red (292.5 to 337.5 deg) -->
        <path d="M 0 0 L -70.21 -29.08 A 76 76 0 0 1 -29.08 -70.21 Z" fill="#ef4444"/>
        <!-- 8. Top Mid: Tangerine Orange (337.5 to 22.5 deg) -->
        <path d="M 0 0 L -29.08 -70.21 A 76 76 0 0 1 29.08 -70.21 Z" fill="#f97316"/>
      </g>

      <!-- Glossy Sector Sheen Overlay -->
      <path d="M -70.21 -29.08 A 76 76 0 0 1 70.21 -29.08 Q 0 10 -70.21 -29.08 Z" fill="#ffffff" opacity="0.18"/>

      <!-- Slice Divider Lines (White/Silver with soft glow) -->
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95">
        <line x1="0" y1="0" x2="29.08" y2="-70.21"/>
        <line x1="0" y1="0" x2="70.21" y2="-29.08"/>
        <line x1="0" y1="0" x2="70.21" y2="29.08"/>
        <line x1="0" y1="0" x2="29.08" y2="70.21"/>
        <line x1="0" y1="0" x2="-29.08" y2="70.21"/>
        <line x1="0" y1="0" x2="-70.21" y2="29.08"/>
        <line x1="0" y1="0" x2="-70.21" y2="-29.08"/>
        <line x1="0" y1="0" x2="-29.08" y2="-70.21"/>
      </g>

      <!-- 8 Perimeter Pearl Studs with Bevel -->
      <g fill="#ffffff" filter="url(#shadow3d)">
        <circle cx="29.08" cy="-70.21" r="3.8"/>
        <circle cx="70.21" cy="-29.08" r="3.8"/>
        <circle cx="70.21" cy="29.08" r="3.8"/>
        <circle cx="29.08" cy="70.21" r="3.8"/>
        <circle cx="-29.08" cy="70.21" r="3.8"/>
        <circle cx="-70.21" cy="29.08" r="3.8"/>
        <circle cx="-70.21" cy="-29.08" r="3.8"/>
        <circle cx="-29.08" cy="-70.21" r="3.8"/>
      </g>

      <!-- Center Hub (Multi-layered 3D gold & sapphire disc) -->
      <circle cx="0" cy="0" r="30" fill="url(#goldBevelGrad)" stroke="#78350f" stroke-width="3" filter="url(#shadow3d)"/>
      <circle cx="0" cy="0" r="23.5" fill="url(#hubNavyGrad)" stroke="#fef08a" stroke-width="2.5"/>

      <!-- Center Brilliant 4-Point Golden Star -->
      <g filter="url(#sparkleGlow)">
        <path d="M 0 -17 Q 0 0 17 0 Q 0 0 0 17 Q 0 0 -17 0 Q 0 0 0 -17 Z" fill="url(#hubStarGrad)"/>
        <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      </g>

      <!-- 3D Top Indicator Arrow (Gold pointer at 12 o'clock) -->
      <g transform="translate(0, -88)" filter="url(#shadow3d)">
        <path d="M -18 -20 L 18 -20 L 0 18 Z" fill="url(#goldRimGrad)" stroke="#78350f" stroke-width="3"/>
        <path d="M -12 -16 L 12 -16 L 0 10 Z" fill="#fef08a" opacity="0.9"/>
      </g>
    </g>

    <!-- Sparkle between Wheel and "Spin" -->
    <g transform="translate(330, 80)" filter="url(#sparkleGlow)">
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="2.8" fill="#ffffff"/>
      <path d="M 10 -18 C 22 -12, 28 4, 25 14" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ========================================== -->
    <!-- 2. UNDER-SWOOSH BLUE RIBBON               -->
    <!-- ========================================== -->
    <path d="M 280 152 C 275 190, 295 230, 335 230 C 385 230, 480 180, 595 178 C 660 176, 700 186, 725 190 C 690 180, 630 172, 560 178 C 445 186, 345 242, 310 200 C 298 184, 298 162, 280 152 Z" 
          fill="url(#blueRibbonGrad)" filter="url(#shadow3d)"/>

    <!-- ========================================== -->
    <!-- 3. 3D WORDMARK: "SpinWheelGames"           -->
    <!-- ========================================== -->
    <!-- Drop Shadow Extrusions for all letters -->
    <g font-family="'Nunito', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="102" letter-spacing="-2.5">
      <!-- 3D Extrusion Shadows -->
      <!-- "Spin" Extrusion Shadow -->
      <text x="270" y="184" fill="#030c2c" opacity="0.85">Spin</text>
      <text x="270" y="182" fill="#06164a" opacity="0.95">Spin</text>
      
      <!-- "Wheel" Extrusion Shadow -->
      <text x="442" y="184" fill="#6c1d07" opacity="0.85">Wheel</text>
      <text x="442" y="182" fill="#9a3412" opacity="0.95">Wheel</text>

      <!-- "Games" Extrusion Shadow -->
      <text x="682" y="184" fill="#022119" opacity="0.85">Games</text>
      <text x="682" y="182" fill="#064e3b" opacity="0.95">Games</text>

      <!-- Front Faces with Vibrant 3D Gradients -->
      <!-- "Spin" Front Face -->
      <text x="270" y="178" fill="url(#spinFaceGrad)" filter="url(#shadow3d)" stroke="#0e2694" stroke-width="2">
        Spin
      </text>

      <!-- "Wheel" Front Face -->
      <text x="442" y="178" fill="url(#wheelFaceGrad)" filter="url(#shadow3d)" stroke="#c2410c" stroke-width="2">
        Wheel
      </text>

      <!-- "Games" Front Face -->
      <text x="682" y="178" fill="url(#gamesFaceGrad)" filter="url(#shadow3d)" stroke="#044e3b" stroke-width="2">
        Games
      </text>
    </g>
  </g>
</svg>
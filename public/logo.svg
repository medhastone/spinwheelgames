<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f2fd"/>
      <stop offset="100%" stop-color="#eeedf7"/>
    </radialGradient>
    <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Wheel Frame -->
  <circle cx="50" cy="50" r="48" fill="#1e1f2b"/>
  <!-- 6 Colorful Slices (60 degrees each) -->
  <path d="M 50 50 L 50 4 A 46 46 0 0 1 89.837 27 L 50 50 Z" fill="#4648d4"/>
  <path d="M 50 50 L 89.837 27 A 46 46 0 0 1 89.837 73 L 50 50 Z" fill="#006c49"/>
  <path d="M 50 50 L 89.837 73 A 46 46 0 0 1 50 96 L 50 50 Z" fill="#dc2c4f"/>
  <path d="M 50 50 L 50 96 A 46 46 0 0 1 10.163 73 L 50 50 Z" fill="#f59e0b"/>
  <path d="M 50 50 L 10.163 73 A 46 46 0 0 1 10.163 27 L 50 50 Z" fill="#6063ee"/>
  <path d="M 50 50 L 10.163 27 A 46 46 0 0 1 50 4 L 50 50 Z" fill="#10b981"/>
  <!-- Subtle Slice Dividers -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M 50 4 L 50 96 M 89.837 27 L 10.163 73 M 89.837 73 L 10.163 27" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Center Hub -->
  <circle cx="50" cy="50" r="16" fill="url(#hubGrad)" filter="url(#hubShadow)"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#4648d4" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="6" fill="#4648d4"/>
  <!-- Indicator Needle at Top -->
  <polygon points="50,14 44,4 56,4" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
</svg>

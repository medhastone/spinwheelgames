name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Build static export for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          # Leave blank when using a custom domain (e.g. spinwheelgames.org).
          # For project sites (username.github.io/repo), this auto-computes /repo:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '' || (endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}', github.event.repository.name)) }}
          GH_PAGES_CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: npm run build:gh-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
